name: Reporte Diario Competencia Hualpen

on:
  schedule:
    # 06:00 AM Chile (UTC-3) = 09:00 UTC — múltiples entradas, verifica duplicados antes de ejecutar
    - cron: '0 9 * * 1-5'     # 06:00 AM Chile — intento principal
    - cron: '15 9 * * 1-5'    # 06:15 AM Chile — respaldo 1
    - cron: '30 9 * * 1-5'    # 06:30 AM Chile — respaldo 2
    - cron: '45 9 * * 1-5'    # 06:45 AM Chile — respaldo 3
    - cron: '0 10 * * 1-5'    # 07:00 AM Chile — respaldo 4
    - cron: '30 10 * * 1-5'   # 07:30 AM Chile — respaldo 5
    - cron: '0 11 * * 1-5'    # 08:00 AM Chile — respaldo final
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar si ya corrió hoy
        id: check
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          RESULT=$(curl -s -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/reportes_competencia?fecha_reporte=eq.${TODAY}&select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}")
          if echo "$RESULT" | grep -q '"id"'; then
            echo "already_ran=true" >> $GITHUB_OUTPUT
            echo "✅ Ya existe reporte para $TODAY — saltando ejecución"
          else
            echo "already_ran=false" >> $GITHUB_OUTPUT
            echo "🔄 No hay reporte para $TODAY — ejecutando"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.already_ran == 'false'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.already_ran == 'false'
        with:
          node-version: '22'

      - name: Instalar wkhtmltopdf
        if: steps.check.outputs.already_ran == 'false'
        run: |
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y wkhtmltopdf && break
            echo "Intento $i falló, reintentando en 10s..."
            sleep 10
          done

      - name: Instalar dependencias
        if: steps.check.outputs.already_ran == 'false'
        run: npm install node-fetch@2 @supabase/supabase-js@2 ws

      - name: Ejecutar scraper
        if: steps.check.outputs.already_ran == 'false'
        id: scraper
        run: node scripts/scrape-competencia.js
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND: ${{ secrets.RESEND }}

      - name: Subir PDF como artifact
        if: steps.check.outputs.already_ran == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: reporte-competencia-hualpen
          path: /tmp/reporte-hualpen.pdf
          if-no-files-found: ignore
          retention-days: 3

      - name: Alerta si falla
        if: failure() && steps.check.outputs.already_ran == 'false'
        run: |
          node -e "
          const fetch = require('node-fetch');
          fetch('https://api.resend.com/emails', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ${{ secrets.RESEND }}', 'Content-Type': 'application/json' },
            body: JSON.stringify({
              from: 'contacto@mulleryperez.cl',
              to: 'contacto@mulleryperez.cl',
              subject: '⚠️ FALLO Reporte Hualpén — $(date -u +%Y-%m-%d)',
              html: '<h2>El reporte diario de Competencia Hualpén falló</h2><p>Revisa el workflow en <a href=\"https://github.com/myp202021/landing-mp-myp/actions\">GitHub Actions</a></p>'
            })
          }).then(r => r.json()).then(d => console.log('Alerta enviada:', d.id)).catch(e => console.error('Error enviando alerta:', e));
          "

      # ════════════════════════════════════════════════════════════
      # WATCHDOG: verificar y disparar otros workflows que no corrieron
      # Se ejecuta SIEMPRE (incluso si el reporte ya corrio hoy)
      # ════════════════════════════════════════════════════════════
      - name: Watchdog - verificar otros workflows
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESEND_KEY: ${{ secrets.RESEND }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)
          echo "=== Watchdog: $TODAY $(date -u +%H:%M) UTC (DOW=$DOW) ==="

          TRIGGERED=""

          check_and_trigger() {
            local repo=$1 wf=$2 name=$3 min_h=$4 days=$5
            if [ "$days" = "weekdays" ] && [ "$DOW" -gt 5 ]; then return; fi
            if [ "$HOUR_UTC" -lt "$min_h" ]; then return; fi
            local ran=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/workflows/$wf/runs?per_page=3&status=success&created=%3E=${TODAY}T00:00:00Z" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('workflow_runs',[])))" 2>/dev/null || echo "0")
            if [ "$ran" = "0" ]; then
              local code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$repo/actions/workflows/$wf/dispatches" -d '{"ref":"main"}')
              echo "TRIGGER $name -> HTTP $code"
              TRIGGERED="$TRIGGERED<li>$name (HTTP $code)</li>"
            else
              echo "OK $name ($ran runs)"
            fi
          }

          R="myp202021/landing-mp-myp"
          check_and_trigger "$R" "blog-diario.yml" "Blog Diario" 10 "daily"
          check_and_trigger "$R" "blog-geo-diario.yml" "Blog GEO" 11 "daily"
          check_and_trigger "$R" "clipping-prensa-hualpen.yml" "Clipping Hualpen" 10 "daily"
          check_and_trigger "$R" "clipping-swing-artistas.yml" "Clipping Swing" 11 "daily"
          check_and_trigger "$R" "invas-blog-diario.yml" "Invas Blog" 11 "weekdays"
          check_and_trigger "$R" "columna-semanal.yml" "Columna Semanal" 11 "weekdays"
          check_and_trigger "myp202021/devuelvemipie-seo" "dmp-blog-diario.yml" "DMP Blog" 11 "weekdays"
          check_and_trigger "myp202021/lablab-seo" "lablab-blog-diario.yml" "LabLab Blog" 11 "weekdays"
          check_and_trigger "myp202021/premiosincreibles-seo" "pinc-blog-diario.yml" "Premios Blog" 12 "daily"

          if [ "$DOW" = "4" ]; then
            check_and_trigger "$R" "blog-rankings-semanal.yml" "Rankings M&P" 12 "weekdays"
            check_and_trigger "$R" "invas-blog-rankings-semanal.yml" "Rankings Invas" 12 "weekdays"
          fi
          if [ "$DOW" = "5" ]; then
            check_and_trigger "myp202021/devuelvemipie-seo" "dmp-blog-rankings-semanal.yml" "DMP Rankings" 12 "weekdays"
            check_and_trigger "myp202021/lablab-seo" "lablab-rankings-semanal.yml" "LabLab Rankings" 12 "weekdays"
          fi

          if [ -n "$TRIGGERED" ]; then
            echo "Enviando alerta..."
            curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_KEY" -H "Content-Type: application/json" \
              -d "{\"from\":\"Watchdog <contacto@mulleryperez.cl>\",\"to\":\"contacto@mulleryperez.cl\",\"subject\":\"Watchdog $TODAY\",\"html\":\"<h2>Watchdog $TODAY</h2><ul>$TRIGGERED</ul>\"}" \
              | python3 -c "import json,sys; print('Email:', json.load(sys.stdin).get('id','ERR'))" 2>/dev/null
          else
            echo "Todos OK"
          fi
