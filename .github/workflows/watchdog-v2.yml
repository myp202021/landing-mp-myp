name: Watchdog — Verificar y disparar workflows diarios

on:
  schedule:
    # Cada 20 minutos de 09:30 a 14:40 UTC (06:30 a 11:40 AM Chile)
    # Más entradas = más chances de que GitHub dispare al menos una
    - cron: '30 9 * * *'
    - cron: '50 9 * * *'
    - cron: '10 10 * * *'
    - cron: '30 10 * * *'
    - cron: '50 10 * * *'
    - cron: '10 11 * * *'
    - cron: '30 11 * * *'
    - cron: '50 11 * * *'
    - cron: '10 12 * * *'
    - cron: '30 12 * * *'
    - cron: '50 12 * * *'
    - cron: '10 13 * * *'
    - cron: '30 13 * * *'
    - cron: '50 13 * * *'
    - cron: '10 14 * * *'
    - cron: '30 14 * * *'
  workflow_dispatch:

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar y disparar workflows que no corrieron hoy
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          RESEND_KEY: ${{ secrets.RESEND }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          HOUR_UTC=$(date -u +%H)
          DOW=$(date -u +%u)  # 1=lunes, 7=domingo

          echo "=== Watchdog: $TODAY $(date -u +%H:%M) UTC (DOW=$DOW) ==="

          TRIGGERED=""
          ERRORS=""

          check_and_trigger() {
            local repo=$1
            local workflow_file=$2
            local workflow_name=$3
            local min_hour_utc=$4
            local days=$5  # "daily" o "weekdays"

            # Si es fin de semana y el workflow es solo L-V, saltar
            if [ "$days" = "weekdays" ] && [ "$DOW" -gt 5 ]; then
              return
            fi

            # Solo verificar si ya paso la hora esperada + 30 min de gracia
            if [ "$HOUR_UTC" -lt "$min_hour_utc" ]; then
              return
            fi

            # Buscar si hubo un run exitoso hoy
            local response
            response=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$repo/actions/workflows/$workflow_file/runs?per_page=5&status=success&created=%3E=${TODAY}T00:00:00Z")

            local ran
            ran=$(echo "$response" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('workflow_runs',[])))" 2>/dev/null || echo "error")

            if [ "$ran" = "error" ]; then
              echo "ERROR $workflow_name ($repo) — no se pudo verificar"
              ERRORS="$ERRORS<li>❌ $workflow_name — error al verificar</li>"
              return
            fi

            if [ "$ran" = "0" ]; then
              echo "TRIGGER $workflow_name ($repo) — no corrio hoy, disparando..."
              local dispatch_result
              dispatch_result=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github.v3+json" \
                "https://api.github.com/repos/$repo/actions/workflows/$workflow_file/dispatches" \
                -d '{"ref":"main"}')

              if [ "$dispatch_result" = "204" ]; then
                echo " -> Disparado OK!"
                TRIGGERED="$TRIGGERED<li>🔄 $workflow_name</li>"
              else
                echo " -> ERROR al disparar (HTTP $dispatch_result)"
                ERRORS="$ERRORS<li>❌ $workflow_name — HTTP $dispatch_result al disparar</li>"
              fi
            else
              echo "OK $workflow_name — ya corrio hoy ($ran runs)"
            fi
          }

          # ============================================================
          # REPO: landing-mp-myp
          # ============================================================
          MAIN_REPO="myp202021/landing-mp-myp"

          # Diarios (L-D)
          check_and_trigger "$MAIN_REPO" "blog-diario.yml" "Blog Diario M&P" 10 "daily"
          check_and_trigger "$MAIN_REPO" "blog-geo-diario.yml" "Blog GEO Diario" 11 "daily"
          check_and_trigger "$MAIN_REPO" "clipping-prensa-hualpen.yml" "Clipping Prensa Hualpén" 10 "daily"
          check_and_trigger "$MAIN_REPO" "clipping-swing-artistas.yml" "Clipping Swing" 11 "daily"
          check_and_trigger "$MAIN_REPO" "backup-supabase.yml" "Backup Supabase" 9 "daily"

          # L-V
          check_and_trigger "$MAIN_REPO" "competencia-hualpen.yml" "Competencia Hualpén" 10 "weekdays"
          check_and_trigger "$MAIN_REPO" "invas-blog-diario.yml" "Invas Blog Diario" 11 "weekdays"
          check_and_trigger "$MAIN_REPO" "copilot-agentes-test.yml" "Copilot Pipeline" 12 "weekdays"
          check_and_trigger "$MAIN_REPO" "radar-lifecycle.yml" "Radar Lifecycle" 12 "weekdays"
          check_and_trigger "$MAIN_REPO" "columna-semanal.yml" "Columna Semanal" 11 "weekdays"

          # Rankings semanales (jueves)
          if [ "$DOW" = "4" ]; then
            check_and_trigger "$MAIN_REPO" "blog-rankings-semanal.yml" "Rankings M&P (Jueves)" 12 "weekdays"
            check_and_trigger "$MAIN_REPO" "invas-blog-rankings-semanal.yml" "Rankings Invas (Jueves)" 12 "weekdays"
          fi

          # Indicadores marketing (sábado)
          if [ "$DOW" = "6" ]; then
            check_and_trigger "$MAIN_REPO" "indicadores-marketing.yml" "Indicadores Marketing" 12 "daily"
          fi

          # Reportes mensuales (día 1)
          DAY=$(date -u +%d)
          if [ "$DAY" = "01" ]; then
            check_and_trigger "$MAIN_REPO" "radar-clipping-mensual.yml" "Radar Clipping Mensual" 13 "daily"
          fi

          # Prospección (martes)
          if [ "$DOW" = "2" ]; then
            check_and_trigger "$MAIN_REPO" "prospecting.yml" "Prospección (Martes)" 13 "weekdays"
          fi

          # ============================================================
          # REPO: devuelvemipie-seo
          # ============================================================
          DMP_REPO="myp202021/devuelvemipie-seo"
          check_and_trigger "$DMP_REPO" "dmp-blog-diario.yml" "DMP Blog Diario" 11 "weekdays"
          if [ "$DOW" = "5" ]; then
            check_and_trigger "$DMP_REPO" "dmp-blog-rankings-semanal.yml" "DMP Rankings (Viernes)" 12 "weekdays"
          fi

          # ============================================================
          # REPO: lablab-seo
          # ============================================================
          LABLAB_REPO="myp202021/lablab-seo"
          check_and_trigger "$LABLAB_REPO" "lablab-blog-diario.yml" "LabLab Blog Diario" 11 "weekdays"
          if [ "$DOW" = "5" ]; then
            check_and_trigger "$LABLAB_REPO" "lablab-rankings-semanal.yml" "LabLab Rankings (Viernes)" 12 "weekdays"
          fi

          # ============================================================
          # REPO: premiosincreibles-seo
          # ============================================================
          PI_REPO="myp202021/premiosincreibles-seo"
          check_and_trigger "$PI_REPO" "pinc-blog-diario.yml" "Premios Blog Diario" 12 "daily"

          # ============================================================
          # ENVIAR RESUMEN POR EMAIL SI HUBO TRIGGERS O ERRORES
          # ============================================================
          if [ -n "$TRIGGERED" ] || [ -n "$ERRORS" ]; then
            echo ""
            echo "=== Enviando alerta por email ==="

            BODY="<h2>🐕 Watchdog — $TODAY $(date -u +%H:%M) UTC</h2>"

            if [ -n "$TRIGGERED" ]; then
              BODY="$BODY<h3>Workflows disparados manualmente:</h3><ul>$TRIGGERED</ul>"
            fi

            if [ -n "$ERRORS" ]; then
              BODY="$BODY<h3>Errores:</h3><ul>$ERRORS</ul>"
            fi

            BODY="$BODY<p style='color:#888;font-size:12px;margin-top:20px;'>GitHub Actions no los disparó a tiempo. El Watchdog los ejecutó como respaldo.</p>"

            curl -s -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_KEY" \
              -H "Content-Type: application/json" \
              -d "$(python3 -c "
import json
print(json.dumps({
    'from': 'Watchdog M&P <contacto@mulleryperez.cl>',
    'to': 'contacto@mulleryperez.cl',
    'subject': '🐕 Watchdog: workflows disparados manualmente — $TODAY',
    'html': '''$BODY'''
}))
")" | python3 -c "import json,sys; d=json.load(sys.stdin); print('Email enviado:', d.get('id','ERROR'))"

          else
            echo ""
            echo "✅ Todos los workflows corrieron a tiempo — nada que hacer"
          fi

          echo "=== Watchdog completo ==="
